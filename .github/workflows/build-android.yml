name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: cordova platform add android@latest

      - name: Build Android APK
        run: |
          cordova build android --device
          echo "Build completed successfully"

      - name: Find APK files
        run: |
          find . -name "*.apk" -type f
          ls -la platforms/android/app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RUthirsty-Android-APK
          path: |
            platforms/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Create build summary
        run: |
          echo "# 🎉 Android APK 构建成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 应用信息" >> $GITHUB_STEP_SUMMARY
          echo "- 应用名称: RUthirsty" >> $GITHUB_STEP_SUMMARY
          echo "- Bundle ID: com.ruthirsty.watertracker" >> $GITHUB_STEP_SUMMARY
          echo "- 版本: 1.0.0" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📥 下载 APK" >> $GITHUB_STEP_SUMMARY
          echo "1. 在下方 Artifacts 部分下载 **RUthirsty-Android-APK**" >> $GITHUB_STEP_SUMMARY
          echo "2. 解压下载的 zip 文件" >> $GITHUB_STEP_SUMMARY
          echo "3. 找到 .apk 文件并安装到手机" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📱 安装到 Android 手机" >> $GITHUB_STEP_SUMMARY
          echo "1. 将 APK 文件发送到手机（通过微信、QQ、数据线等）" >> $GITHUB_STEP_SUMMARY
          echo "2. 在手机上点击 APK 文件" >> $GITHUB_STEP_SUMMARY
          echo "3. 如有提示，点击 \"允许未知来源\"" >> $GITHUB_STEP_SUMMARY
          echo "4. 点击 \"安装\"" >> $GITHUB_STEP_SUMMARY
          echo "5. 安装完成后即可使用！" >> $GITHUB_STEP_SUMMARY
